name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what happened, and what you expected. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lighthouse version
      description: Settings → About
      placeholder: 0.1.3 (sideload)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: AYN Odin 2 Portal, LineageOS 24 (Android 17)
    validations:
      required: true
  - type: dropdown
    id: root
    attributes:
      label: Rooted?
      options: ["No", "Yes (Magisk)", "Yes (KernelSU / other)"]
    validations:
      required: true
  - type: input
    id: emulator
    attributes:
      label: Emulator and version (if it's about launching a game)
      placeholder: Eden 0.2.0
  - type: textarea
    id: log
    attributes:
      label: Log (for crashes)
      description: "Optional. With adb: `adb logcat -d | grep -i lighthouse`"
      render: text
