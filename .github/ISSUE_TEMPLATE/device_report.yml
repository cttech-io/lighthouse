name: Device report
description: Tell us how Lighthouse works on your handheld, good or bad.
labels: [device]
body:
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Retroid Pocket 5
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version / ROM
      placeholder: Android 13 (stock)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lighthouse version
      placeholder: 0.1.3
    validations:
      required: true
  - type: dropdown
    id: overall
    attributes:
      label: Overall
      options: ["Works well", "Works with small problems", "Hard to use", "Doesn't work"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Details
      description: Controller buttons, screen layout, performance, which emulators you launched. Screenshots welcome.
