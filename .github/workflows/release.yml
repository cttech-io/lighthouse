name: Release

# A v* tag builds, signs and publishes a GitHub Release (tags with a suffix, e.g. v0.1.3-rc1, are pre-releases).
# Running it by hand builds and signs an APK as a workflow artifact only, to test signing without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Read version
        id: version
        run: |
          NAME=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            TAG=${GITHUB_REF_NAME#v}
            # The tag must match the app's version (ignoring an -rcN style suffix).
            if [[ "${TAG%%-*}" != "$NAME" ]]; then
              echo "::error::tag $GITHUB_REF_NAME doesn't match versionName $NAME"; exit 1
            fi
            echo "file=lighthouse-$TAG.apk" >> "$GITHUB_OUTPUT"
          else
            echo "file=lighthouse-$NAME-$(git rev-parse --short HEAD).apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew --console=plain testSideloadDebugUnitTest

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.LIGHTHOUSE_KEYSTORE_B64 }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then echo "::error::LIGHTHOUSE_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build signed release (sideload)
        env:
          LIGHTHOUSE_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          LIGHTHOUSE_KEYSTORE_PASSWORD: ${{ secrets.LIGHTHOUSE_KEYSTORE_PASSWORD }}
        run: ./gradlew --console=plain assembleSideloadRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Verify signature and checksum
        run: |
          mkdir dist
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk "dist/${{ steps.version.outputs.file }}"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "dist/${{ steps.version.outputs.file }}" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::APK is debug-signed, not release-signed"; exit 1; fi
          (cd dist && sha256sum *.apk > SHA256SUMS)
          {
            echo "### ${{ steps.version.outputs.file }}"
            echo '```'
            grep "SHA-256" certs.txt
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${{ steps.version.outputs.name }}
          # Notes = this version's CHANGELOG section ("## 0.1.3 (date)" up to the next "## ").
          awk -v v="$VER" 'index($0, "## " v " ") == 1 {f=1; next} /^## /{if (f) exit} f' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || echo "See CHANGELOG.md." > notes.md
          {
            echo
            echo "**Signing certificate SHA-256:** \`$(grep -m1 'certificate SHA-256' certs.txt | awk '{print $NF}')\`"
          } >> notes.md
          PRE=""; [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Lighthouse $GITHUB_REF_NAME" --notes-file notes.md $PRE
