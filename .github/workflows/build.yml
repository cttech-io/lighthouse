name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # Both flavours must always build: the play flavour is our future Play Store route.
      - name: Assemble debug (sideload + play)
        run: ./gradlew --console=plain assembleSideloadDebug assemblePlayDebug
      # Errors fail the build (e.g. NewApi: calling something newer than minSdk, which crashes old devices).
      - name: Lint
        run: ./gradlew --console=plain lintSideloadRelease
      - name: Check the play flavour has no broad storage permission
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          if "$AAPT2" dump permissions app/build/outputs/apk/play/debug/app-play-debug.apk | grep -q MANAGE_EXTERNAL_STORAGE; then
            echo "::error::play flavour must not request MANAGE_EXTERNAL_STORAGE"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
