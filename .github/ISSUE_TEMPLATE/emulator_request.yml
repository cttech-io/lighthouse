name: Emulator or platform request
description: Ask for an emulator, platform or PC game app to be supported.
labels: [emulator]
body:
  - type: input
    id: emulator
    attributes:
      label: Emulator or app
      description: Name and where it comes from (Play Store, GitHub, website).
      placeholder: Azahar (GitHub)
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package name, if you know it
      placeholder: com.example.emulator
  - type: input
    id: platform
    attributes:
      label: Platform(s)
      placeholder: Nintendo 3DS
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: File types, whether it opens games from other apps, links to its docs. A tested launch profile (see CONTRIBUTING.md) is even better.
